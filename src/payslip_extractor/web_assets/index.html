<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payslip PDF Extractor</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --panel: #ffffff;
      --ink: #182026;
      --muted: #66727c;
      --line: #d7dde2;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
      --soft: #edf7f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    header .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .status-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--muted);
      background: #fbfcfd;
      white-space: nowrap;
    }

    main.wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 16px;
      padding: 16px 0 28px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    .file-button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #ffffff;
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 11px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
    }

    button:hover,
    .file-button:hover {
      border-color: #a9b4bc;
    }

    label.file-button {
      margin: 0;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input[type="file"] {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    input[type="text"] {
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--ink);
      font: inherit;
      min-height: 36px;
      padding: 7px 10px;
      width: min(560px, 100%);
    }

    .file-list {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      min-height: 220px;
      max-height: 360px;
      overflow: auto;
      background: #fbfcfd;
    }

    .file-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
    }

    .file-item:last-child {
      border-bottom: 0;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .file-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      padding: 20px;
      text-align: center;
    }

    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      max-width: 420px;
    }

    .mode-toggle label {
      margin: 0;
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-weight: 650;
      text-align: center;
    }

    .mode-toggle input {
      display: none;
    }

    .mode-toggle span {
      display: block;
      padding: 10px 12px;
      background: #ffffff;
    }

    .mode-toggle input:checked + span {
      background: var(--soft);
      color: var(--accent-strong);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fbfcfd;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      line-height: 1.1;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .message {
      margin-top: 12px;
      border-radius: 7px;
      padding: 10px 12px;
      background: #eef5ff;
      color: #24476b;
    }

    .message.error {
      background: #fff0ed;
      color: var(--danger);
    }

    .progress-log {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfd;
      max-height: 260px;
      overflow: auto;
    }

    .log-line {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }

    .log-line:last-child {
      border-bottom: 0;
    }

    .log-time {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .log-text {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .log-line.error .log-text {
      color: var(--danger);
      font-weight: 600;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .path-columns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .path-list {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfcfd;
      max-height: 180px;
      overflow: auto;
    }

    .path-row {
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      overflow-wrap: anywhere;
      padding: 8px 10px;
      font-size: 12px;
    }

    .path-row.has-action {
      grid-template-columns: 24px minmax(0, 1fr) 32px;
    }

    .path-row:last-child {
      border-bottom: 0;
    }

    .path-icon {
      color: var(--accent-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .path-icon.skipped {
      color: var(--muted);
    }

    .path-icon svg,
    .icon-button svg {
      display: block;
      height: 16px;
      width: 16px;
    }

    .source-list {
      margin-top: 8px;
      max-height: 150px;
    }

    .manual-pdf-row {
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 32px;
      gap: 8px;
      align-items: center;
      padding: 7px 8px 7px 10px;
    }

    .manual-pdf-row:last-child {
      border-bottom: 0;
    }

    .manual-pdf-path {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    button.icon-button {
      border-radius: 6px;
      min-height: 28px;
      min-width: 28px;
      padding: 0;
    }

    button.icon-button:hover {
      color: var(--danger);
    }

    .source-stack {
      display: grid;
      gap: 10px;
    }

    .source-group {
      display: grid;
      gap: 6px;
    }

    .history-list {
      display: grid;
      gap: 10px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px;
      background: #fbfcfd;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .history-top strong {
      font-size: 13px;
    }

    .history-stats {
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      main.wrap {
        grid-template-columns: 1fr;
      }

      .path-columns,
      .preview-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Payslip PDF Extractor</h1>
      <div class="status-pill" id="serverStatus">Local web UI</div>
    </div>
  </header>

  <main class="wrap">
    <div>
      <section>
        <h2>Inputs</h2>
        <label>PDF sources</label>
        <div class="source-stack">
          <div class="source-group">
            <div class="row">
              <button type="button" id="chooseLocalFolder">Choose root folder...</button>
            </div>
            <div class="file-meta" id="localFolderName">No folder selected</div>
          </div>

          <div class="source-group">
            <div class="row">
              <button type="button" id="choosePdfFiles">Add PDF files...</button>
            </div>
            <div class="file-meta" id="manualPdfName">No individual PDFs added</div>
            <div class="path-list source-list" id="manualPdfList" hidden></div>
          </div>

          <div class="row">
            <button type="button" id="clearSources" disabled>Clear all sources</button>
            <button type="button" id="previewLocalFolder" disabled>Preview selection</button>
          </div>
        </div>

        <label for="includeFolderTerms">Only include folder names</label>
        <input id="includeFolderTerms" type="text" placeholder="bulletin de paie, payslip, payroll">

        <label for="excludeTerms">Exclude folder/name terms</label>
        <input id="excludeTerms" type="text" placeholder="archive, backup, old, temp">

        <div id="folderPreview" hidden>
          <div class="preview-grid">
            <div class="metric"><strong id="previewTotal">0</strong><span>PDFs found</span></div>
            <div class="metric"><strong id="previewIncluded">0</strong><span>PDFs selected</span></div>
            <div class="metric"><strong id="previewSkipped">0</strong><span>PDFs skipped</span></div>
          </div>
          <div class="path-columns">
            <div>
              <label>Selected PDFs</label>
              <div class="path-list" id="includedSample"></div>
            </div>
            <div>
              <label>Skipped PDFs</label>
              <div class="path-list" id="skippedSample"></div>
            </div>
          </div>
        </div>

        <label for="numbersInput">Identifier file</label>
        <div class="row">
          <label class="file-button" for="numbersInput">Choose Excel or CSV...</label>
          <input id="numbersInput" type="file" accept=".xlsx,.xlsm,.csv">
          <span id="numbersName" class="file-meta">No file selected</span>
        </div>

        <label>Output mode</label>
        <div class="mode-toggle">
          <label>
            <input type="radio" name="mode" value="separate" checked>
            <span>One PDF per identifier</span>
          </label>
          <label>
            <input type="radio" name="mode" value="merged">
            <span>One merged PDF</span>
          </label>
        </div>

        <div class="row" style="margin-top: 16px;">
          <button class="primary" type="button" id="processLocalFolder" disabled>Process preview and download ZIP</button>
        </div>

        <div id="messageBox" class="message" hidden></div>
      </section>

      <section style="margin-top: 16px;" id="progressSection" hidden>
        <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
          <h2 style="margin: 0;">Progress</h2>
          <span class="status-pill" id="progressStatus">Ready</span>
        </div>
        <div class="progress-log" id="progressLog"></div>
      </section>

      <section style="margin-top: 16px;" id="lastRunSection" hidden>
        <h2>Last run</h2>
        <div class="summary">
          <div class="metric"><strong id="lastMatchedIds">0</strong><span>Matched identifiers</span></div>
          <div class="metric"><strong id="lastPages">0</strong><span>Pages extracted</span></div>
          <div class="metric"><strong id="lastDuration">0s</strong><span>Processing time</span></div>
        </div>
      </section>
    </div>

    <aside>
      <section>
        <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
          <h2 style="margin: 0;">History</h2>
          <button type="button" id="clearHistory">Clear history</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </section>
    </aside>
  </main>

  <script>
    const numbersInput = document.getElementById("numbersInput");
    const numbersName = document.getElementById("numbersName");
    const messageBox = document.getElementById("messageBox");
    const historyList = document.getElementById("historyList");
    const chooseLocalFolder = document.getElementById("chooseLocalFolder");
    const choosePdfFiles = document.getElementById("choosePdfFiles");
    const clearSources = document.getElementById("clearSources");
    const previewLocalFolder = document.getElementById("previewLocalFolder");
    const processLocalFolder = document.getElementById("processLocalFolder");
    const localFolderName = document.getElementById("localFolderName");
    const manualPdfName = document.getElementById("manualPdfName");
    const manualPdfList = document.getElementById("manualPdfList");
    const includeFolderTerms = document.getElementById("includeFolderTerms");
    const excludeTerms = document.getElementById("excludeTerms");
    const folderPreview = document.getElementById("folderPreview");
    const previewTotal = document.getElementById("previewTotal");
    const previewIncluded = document.getElementById("previewIncluded");
    const previewSkipped = document.getElementById("previewSkipped");
    const includedSample = document.getElementById("includedSample");
    const skippedSample = document.getElementById("skippedSample");
    const progressSection = document.getElementById("progressSection");
    const progressStatus = document.getElementById("progressStatus");
    const progressLog = document.getElementById("progressLog");
    const lastRunSection = document.getElementById("lastRunSection");
    const lastMatchedIds = document.getElementById("lastMatchedIds");
    const lastPages = document.getElementById("lastPages");
    const lastDuration = document.getElementById("lastDuration");

    const historyKey = "payslipExtractor.history.v1";
    let numbersFile = null;
    let uploadProgressLine = null;
    let localFolderPath = "";
    let manualPdfPaths = [];
    let localFolderPreview = null;
    let removedPreviewPaths = new Set();

    function renderHistory() {
      const history = getHistory();
      if (history.length === 0) {
        historyList.innerHTML = '<div class="empty">No local history yet</div>';
        return;
      }

      historyList.innerHTML = "";
      for (const item of history) {
        const row = document.createElement("div");
        row.className = "history-item";
        const skipped = Number(item.skippedPdfCount || 0);
        const skippedText = skipped ? ` - ${skipped} skipped` : "";
        row.innerHTML = `
          <div class="history-top">
            <strong>${escapeHtml(item.mode === "merged" ? "Merged" : "Separate")}</strong>
            <span class="file-meta">${escapeHtml(formatDate(item.createdAt))}</span>
          </div>
          <div class="history-stats">
            ${item.pdfCount} PDFs · ${item.matchedNumbersCount}/${item.numbersCount} identifiers ·
            ${item.matchedPagesCount} pages · ${formatDuration(item.durationSeconds)}
          </div>
        `;
        if (skipped) {
          row.querySelector(".history-stats").textContent += skippedText;
        }
        historyList.appendChild(row);
      }
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(historyKey) || "[]");
      } catch {
        return [];
      }
    }

    function saveHistory(item) {
      const history = [item, ...getHistory()].slice(0, 25);
      localStorage.setItem(historyKey, JSON.stringify(history));
      renderHistory();
    }

    function selectedMode() {
      return document.querySelector('input[name="mode"]:checked').value;
    }

    function showMessage(text, isError = false) {
      messageBox.textContent = text;
      messageBox.className = isError ? "message error" : "message";
      messageBox.hidden = false;
    }

    function clearMessage() {
      messageBox.hidden = true;
      messageBox.textContent = "";
    }

    async function chooseFolder() {
      clearMessage();
      chooseLocalFolder.disabled = true;
      try {
        const response = await fetch("/api/folder/select", { method: "POST" });
        const payload = await readJsonResponse(response);
        if (!response.ok) {
          throw new Error(payload.error || `Folder selection failed with HTTP ${response.status}.`);
        }
        if (payload.cancelled) return;

        localFolderPath = payload.path || "";
        localFolderPreview = null;
        removedPreviewPaths = new Set();
        localFolderName.textContent = localFolderPath || "No folder selected";
        updatePreviewButton();
        processLocalFolder.disabled = true;
        renderFolderPreview(null);
      } catch (error) {
        showMessage(`Folder selection failed: ${error}`, true);
      } finally {
        chooseLocalFolder.disabled = false;
      }
    }

    async function choosePdfs() {
      clearMessage();
      choosePdfFiles.disabled = true;
      try {
        const response = await fetch("/api/pdfs/select", { method: "POST" });
        const payload = await readJsonResponse(response);
        if (!response.ok) {
          throw new Error(payload.error || `PDF selection failed with HTTP ${response.status}.`);
        }
        if (payload.cancelled) return;

        addManualPdfPaths(payload.paths || []);
        localFolderPreview = null;
        removedPreviewPaths = new Set();
        updatePreviewButton();
        processLocalFolder.disabled = true;
        renderFolderPreview(null);
      } catch (error) {
        showMessage(`PDF selection failed: ${error}`, true);
      } finally {
        choosePdfFiles.disabled = false;
      }
    }

    function addManualPdfPaths(paths) {
      const seen = new Set(manualPdfPaths.map(path => path.toLowerCase()));
      for (const path of paths) {
        if (seen.has(String(path).toLowerCase())) continue;
        manualPdfPaths.push(String(path));
        seen.add(String(path).toLowerCase());
      }
      renderManualPdfList();
    }

    function renderManualPdfList() {
      manualPdfName.textContent = manualPdfPaths.length
        ? `${manualPdfPaths.length} individual PDF${manualPdfPaths.length === 1 ? "" : "s"} added`
        : "No individual PDFs added";

      manualPdfList.innerHTML = "";
      manualPdfList.hidden = manualPdfPaths.length === 0;
      manualPdfPaths.forEach((path, index) => {
        const row = document.createElement("div");
        row.className = "manual-pdf-row";

        const text = document.createElement("span");
        text.className = "manual-pdf-path";
        text.textContent = path;
        text.title = path;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "icon-button";
        remove.title = "Remove this PDF";
        remove.setAttribute("aria-label", `Remove ${path}`);
        remove.appendChild(createIcon("trash"));
        remove.addEventListener("click", () => removeManualPdf(index));

        row.append(text, remove);
        manualPdfList.appendChild(row);
      });
    }

    function removeManualPdf(index) {
      manualPdfPaths.splice(index, 1);
      localFolderPreview = null;
      removedPreviewPaths = new Set();
      processLocalFolder.disabled = true;
      renderFolderPreview(null);
      renderManualPdfList();
      updatePreviewButton();
    }

    function updatePreviewButton() {
      const hasPdfSources = Boolean(localFolderPath) || manualPdfPaths.length > 0;
      clearSources.disabled = !hasPdfSources;
      previewLocalFolder.disabled = !hasPdfSources;
    }

    function clearPdfSources() {
      localFolderPath = "";
      manualPdfPaths = [];
      localFolderPreview = null;
      removedPreviewPaths = new Set();
      localFolderName.textContent = "No folder selected";
      renderManualPdfList();
      processLocalFolder.disabled = true;
      progressSection.hidden = true;
      progressLog.innerHTML = "";
      setProgressStatus("Ready");
      uploadProgressLine = null;
      renderFolderPreview(null);
      updatePreviewButton();
      showMessage("PDF sources cleared.");
    }

    async function previewFolder() {
      clearMessage();
      if (!localFolderPath && manualPdfPaths.length === 0) {
        showMessage("Choose a local root folder or add PDF files first.", true);
        return;
      }

      previewLocalFolder.disabled = true;
      processLocalFolder.disabled = true;
      beginProgress("Starting PDF preview. Python is listing folder entries; network or VPN folders can take time here.");
      showMessage("Enumerating selected PDFs and applying filters.");
      try {
        const response = await fetch("/api/folder/preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            rootPath: localFolderPath,
            pdfPaths: manualPdfPaths,
            includeFolderTerms: includeFolderTerms.value,
            excludeTerms: excludeTerms.value,
          }),
        });
        const payload = await readJsonResponse(response);
        if (!response.ok) {
          throw new Error(payload.error || `PDF preview failed with HTTP ${response.status}.`);
        }

        const preview = await waitForPreview(payload.previewJobId);
        localFolderPreview = preview;
        removedPreviewPaths = new Set();
        renderFolderPreview(preview);
        processLocalFolder.disabled = effectiveIncludedCount(preview) === 0;
        showMessage(`Preview ready. ${effectiveIncludedCount(preview)} PDF(s) selected, ${preview.skippedCount || 0} skipped.`);
      } catch (error) {
        localFolderPreview = null;
        renderFolderPreview(null);
        showMessage(`PDF preview failed: ${error}`, true);
      } finally {
        updatePreviewButton();
      }
    }

    async function processFolderPreview() {
      clearMessage();
      if (!numbersFile) {
        showMessage("Choose an Excel or CSV identifier file.", true);
        return;
      }
      if (!localFolderPreview || !localFolderPreview.previewId) {
        showMessage("Preview the selected PDFs first.", true);
        return;
      }
      if (effectiveIncludedCount(localFolderPreview) === 0) {
        showMessage("No PDFs remain selected after manual removals.", true);
        return;
      }

      const form = new FormData();
      form.append("preview_id", localFolderPreview.previewId);
      form.append("removed_paths", JSON.stringify([...removedPreviewPaths]));
      form.append("mode", selectedMode());
      form.append("numbers_file", numbersFile, numbersFile.name);

      processLocalFolder.disabled = true;
      beginProgress("Copying identifier file to the local extractor. PDF files stay where they are and are read during extraction.");
      showMessage("Processing selected PDFs. Keep this window open.");
      try {
        const startPayload = await startExtractionJob(form, folderExtractionMessages());
        if (!startPayload.jobId) {
          throw new Error("The local extractor did not return a job id.");
        }

        const job = await waitForJob(startPayload.jobId);
        await downloadFinishedJob(job);
      } catch (error) {
        showMessage(`Extraction failed: ${error}`, true);
        setProgressStatus("Failed");
      } finally {
        processLocalFolder.disabled = !localFolderPreview || effectiveIncludedCount(localFolderPreview) === 0;
      }
    }

    async function downloadFinishedJob(job) {
      const downloadResponse = await fetch(job.downloadUrl || `/api/jobs/${encodeURIComponent(job.jobId)}/download`);
      if (!downloadResponse.ok) {
        const payload = await readJsonResponse(downloadResponse);
        throw new Error(payload.error || `Download failed with HTTP ${downloadResponse.status}.`);
      }

      const blob = await downloadResponse.blob();
      const headerSummary = parseSummaryHeader(downloadResponse.headers.get("X-Extraction-Summary"));
      const summary = job.summary || headerSummary;
      const downloadName = summary.downloadName || `payslip-extractor-results-${Date.now()}.zip`;
      downloadBlob(blob, downloadName);
      saveHistory(summary);
      updateLastRun(summary);
      showMessage(`Done. Downloaded ${downloadName}.`);
    }

    function folderExtractionMessages() {
      return {
        url: "/api/folder/start",
        loadedText: "Identifier file copied. Preparing local extraction job.",
        loadedStatus: "Preparing",
        startedText: "Local extraction job started.",
        progressStatus: "Copying",
        progressText: (loaded, total, percent) =>
          `Copying identifier file: ${formatBytes(loaded)} of ${formatBytes(total)} (${percent}%). PDFs stay in their selected locations.`,
        indeterminateText: loaded =>
          `Copying identifier file: ${formatBytes(loaded)} sent. PDFs stay in their selected locations.`,
      };
    }

    function renderFolderPreview(preview) {
      if (!preview) {
        folderPreview.hidden = true;
        previewTotal.textContent = "0";
        previewIncluded.textContent = "0";
        previewSkipped.textContent = "0";
        includedSample.innerHTML = "";
        skippedSample.innerHTML = "";
        return;
      }

      folderPreview.hidden = false;
      previewTotal.textContent = String(preview.totalPdfCount || 0);
      previewIncluded.textContent = String(effectiveIncludedCount(preview));
      previewSkipped.textContent = String(preview.skippedCount || 0);
      renderPathSample(
        includedSample,
        (preview.includedSamples || []).filter(item => !removedPreviewPaths.has(item.path)),
        "No selected PDFs in this preview sample",
        "check",
        removePreviewPdf
      );
      renderPathSample(skippedSample, preview.skippedSamples || [], "No skipped PDFs", "skipped");
    }

    function effectiveIncludedCount(preview) {
      return Math.max(0, Number(preview.includedCount || 0) - removedPreviewPaths.size);
    }

    function removePreviewPdf(path) {
      removedPreviewPaths.add(path);
      renderFolderPreview(localFolderPreview);
      processLocalFolder.disabled = !localFolderPreview || effectiveIncludedCount(localFolderPreview) === 0;
    }

    function renderPathSample(container, items, emptyText, iconName, onRemove = null) {
      container.innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = emptyText;
        container.appendChild(empty);
        return;
      }

      for (const item of items) {
        const row = document.createElement("div");
        row.className = onRemove ? "path-row has-action" : "path-row";
        const icon = document.createElement("span");
        icon.className = `path-icon ${iconName === "skipped" ? "skipped" : ""}`;
        icon.appendChild(createIcon(iconName));
        const text = document.createElement("span");
        text.textContent = item.reason ? `${item.path} - ${item.reason}` : item.path;
        row.append(icon, text);
        if (onRemove) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "icon-button";
          remove.title = "Remove this PDF from extraction";
          remove.setAttribute("aria-label", `Remove ${item.path}`);
          remove.appendChild(createIcon("trash"));
          remove.addEventListener("click", () => onRemove(item.path));
          row.appendChild(remove);
        }
        container.appendChild(row);
      }
    }

    function createIcon(name) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "2");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("aria-hidden", "true");

      const paths = {
        check: ["M20 6 9 17l-5-5"],
        skipped: ["M4 4l16 16", "M20 4 4 20"],
        trash: ["M3 6h18", "M8 6V4h8v2", "M19 6l-1 14H6L5 6", "M10 11v6", "M14 11v6"],
      };

      for (const value of paths[name] || paths.check) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", value);
        svg.appendChild(path);
      }
      return svg;
    }

    function startExtractionJob(form, messages) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", messages.url);
        request.responseType = "json";

        request.upload.addEventListener("progress", event => {
          updateUploadProgress(event, messages);
        });

        request.upload.addEventListener("load", () => {
          setUploadProgress(messages.loadedText);
          setProgressStatus(messages.loadedStatus);
        });

        request.addEventListener("load", () => {
          const payload = readXhrJson(request);
          if (request.status < 200 || request.status >= 300) {
            reject(new Error(payload.error || `Extraction failed with HTTP ${request.status}.`));
            return;
          }
          setUploadProgress(messages.startedText);
          setProgressStatus("Queued");
          resolve(payload);
        });

        request.addEventListener("error", () => {
          reject(new Error("Could not send the identifier file to the local extractor."));
        });

        request.addEventListener("abort", () => {
          reject(new Error("Identifier file copy was cancelled."));
        });

        request.send(form);
      });
    }

    function readXhrJson(request) {
      if (request.response && typeof request.response === "object") return request.response;
      try {
        return JSON.parse(request.responseText || "{}");
      } catch {
        return {};
      }
    }

    function updateUploadProgress(event, messages) {
      if (event.lengthComputable && event.total > 0) {
        const percent = Math.min(100, Math.round((event.loaded / event.total) * 100));
        setProgressStatus(`${messages.progressStatus} ${percent}%`);
        setUploadProgress(messages.progressText(event.loaded, event.total, percent));
        return;
      }

      setProgressStatus(messages.progressStatus);
      setUploadProgress(messages.indeterminateText(event.loaded || 0));
    }

    async function waitForJob(jobId) {
      while (true) {
        const response = await fetch(`/api/jobs/${encodeURIComponent(jobId)}`);
        const job = await readJsonResponse(response);
        if (!response.ok) {
          throw new Error(job.error || `Could not read progress with HTTP ${response.status}.`);
        }

        renderProgress(job);
        if (job.status === "done") return job;
        if (job.status === "error") {
          throw new Error(job.error || "Extraction failed.");
        }

        await delay(800);
      }
    }

    async function waitForPreview(previewJobId) {
      if (!previewJobId) {
        throw new Error("The local extractor did not return a preview job id.");
      }

      while (true) {
        const response = await fetch(`/api/previews/${encodeURIComponent(previewJobId)}`);
        const job = await readJsonResponse(response);
        if (!response.ok) {
          throw new Error(job.error || `Could not read preview progress with HTTP ${response.status}.`);
        }

        renderProgress({ status: job.status, messages: job.messages || [] });
        if (job.status === "done" && job.preview) return job.preview;
        if (job.status === "error") {
          throw new Error(job.error || "PDF preview failed.");
        }

        await delay(800);
      }
    }

    async function readJsonResponse(response) {
      try {
        return await response.json();
      } catch {
        return {};
      }
    }

    function delay(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function beginProgress(text) {
      progressSection.hidden = false;
      progressLog.innerHTML = "";
      uploadProgressLine = null;
      setProgressStatus("Starting");
      uploadProgressLine = appendProgressLine({ time: formatClock(new Date()), level: "info", text });
    }

    function renderProgress(job) {
      progressSection.hidden = false;
      setProgressStatus(formatJobStatus(job.status));
      progressLog.innerHTML = "";
      uploadProgressLine = null;

      const messages = Array.isArray(job.messages) ? job.messages : [];
      if (messages.length === 0) {
        appendProgressLine({ time: formatClock(new Date()), level: "info", text: "Waiting for extraction to start." });
      } else {
        for (const message of messages) appendProgressLine(message);
      }
      progressLog.scrollTop = progressLog.scrollHeight;
    }

    function setUploadProgress(text) {
      if (!uploadProgressLine) {
        uploadProgressLine = appendProgressLine({ time: formatClock(new Date()), level: "info", text });
      } else {
        uploadProgressLine.time.textContent = formatClock(new Date());
        uploadProgressLine.text.textContent = text;
      }
      progressLog.scrollTop = progressLog.scrollHeight;
    }

    function appendProgressLine(message) {
      const row = document.createElement("div");
      row.className = `log-line ${message.level === "error" ? "error" : ""}`;

      const time = document.createElement("span");
      time.className = "log-time";
      time.textContent = message.time || "";

      const text = document.createElement("span");
      text.className = "log-text";
      text.textContent = message.text || "";

      row.append(time, text);
      progressLog.appendChild(row);
      return { row, time, text };
    }

    function setProgressStatus(text) {
      progressStatus.textContent = text;
    }

    function formatJobStatus(status) {
      if (status === "queued") return "Queued";
      if (status === "running") return "Running";
      if (status === "done") return "Ready";
      if (status === "error") return "Failed";
      return "Working";
    }

    function formatClock(date) {
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    function parseSummaryHeader(value) {
      if (!value) return {};
      try {
        return JSON.parse(new TextDecoder().decode(base64UrlToBytes(value)));
      } catch {
        return {};
      }
    }

    function base64UrlToBytes(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
    }

    function updateLastRun(summary) {
      lastRunSection.hidden = false;
      lastMatchedIds.textContent = String(summary.matchedNumbersCount || 0);
      lastPages.textContent = String(summary.matchedPagesCount || 0);
      lastDuration.textContent = formatDuration(summary.durationSeconds || 0);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      const units = ["KB", "MB", "GB"];
      let value = bytes / 1024;
      let unit = units.shift();
      while (value >= 1024 && units.length) {
        value /= 1024;
        unit = units.shift();
      }
      return `${value.toFixed(value >= 10 ? 0 : 1)} ${unit}`;
    }

    function formatDuration(seconds) {
      const value = Number(seconds) || 0;
      if (value < 60) return `${Math.round(value)}s`;
      const minutes = Math.floor(value / 60);
      const rest = Math.round(value % 60);
      return `${minutes}m ${rest}s`;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    numbersInput.addEventListener("change", event => {
      numbersFile = event.target.files[0] || null;
      numbersName.textContent = numbersFile ? `${numbersFile.name} (${formatBytes(numbersFile.size)})` : "No file selected";
    });

    document.getElementById("clearHistory").addEventListener("click", () => {
      localStorage.removeItem(historyKey);
      renderHistory();
    });

    chooseLocalFolder.addEventListener("click", chooseFolder);
    choosePdfFiles.addEventListener("click", choosePdfs);
    clearSources.addEventListener("click", clearPdfSources);
    previewLocalFolder.addEventListener("click", previewFolder);
    processLocalFolder.addEventListener("click", processFolderPreview);
    function invalidatePreview() {
      localFolderPreview = null;
      removedPreviewPaths = new Set();
      processLocalFolder.disabled = true;
      renderFolderPreview(null);
    }

    includeFolderTerms.addEventListener("input", invalidatePreview);
    excludeTerms.addEventListener("input", invalidatePreview);

    renderManualPdfList();
    renderFolderPreview(null);
    renderHistory();
  </script>
</body>
</html>
